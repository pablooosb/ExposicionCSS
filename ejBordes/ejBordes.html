<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos bordes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="ejBordes.css">
</head>
<body>

    <header>
        <h1>Ejemplo práctico de bordes</h1>
    </header>

    <main class="container">
        <section class="box border-radius-fancy card">
            <span>Borde abstracto</span>
            <h2>Plan Básico</h2>
            <div class="precio">9€<span>/mes</span></div>
            <ul class="caracteristicas">
                <li><i class="bi bi-check-circle"></i> 1 Proyecto activo</li>
                <li><i class="bi bi-check-circle"></i> Soporte por email</li>
            </ul>
            <button class="btn">Empezar ahora</button>
        </section>

        <section class="box animated-border card">
            <span>Borde animado</span>
            <h2>Plan Pro</h2>
            <div class="precio">29€<span>/mes</span></div>
            <ul class="caracteristicas">
                <li><i class="bi bi-check-circle"></i> Proyectos ilimitados</li>
                <li><i class="bi bi-check-circle"></i> IA Integrada</li>
                <li><i class="bi bi-check-circle"></i> Soporte 24/7</li>
            </ul>
            <button class="btn">Suscribirse</button>
        </section>

        <section class="box clip-border card">
            <span>Borde con degradado</span>
            <h2>Enterprise</h2>
            <div class="precio">Personalizado</div>
            <ul class="caracteristicas">
                <li><i class="bi bi-check-circle"></i> Seguridad avanzada</li>
                <li><i class="bi bi-check-circle"></i> Servidores dedicados</li>
            </ul>
            <button class="btn">Contactar</button>
        </section>
    </main>
</body>
</html>
